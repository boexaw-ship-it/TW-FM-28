name: Migrate Data to Project 2

on:
  workflow_dispatch: # Manual ဝင်နှိပ်ရန်သာ

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm init -y
          npm install firebase-admin
      - name: Run Migration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_2 }}
        run: node scripts/migrate-to-project2.js
        
