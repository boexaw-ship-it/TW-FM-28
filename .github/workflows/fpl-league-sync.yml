# ============================================
# TW Fantasy Official League
# League Standings Sync Workflow (Manual Only)
# ============================================

name: FPL League Sync (Manual)

on:
  workflow_dispatch: # GitHub Actions ထဲမှ Manual "Run workflow" နှိပ်မှသာ အလုပ်လုပ်မည်

jobs:
  league-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install firebase-admin axios

      # 🚀 Run League Sync (Project 1)
      - name: Run League Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/league-sync.js

      - name: Sync Complete
        run: echo "✅ League Standings Sync Finished at $(date)"
