# ============================================
# TW Fantasy Official League
# Player Scout Sync Workflow (Lockfile-Free Bug Fix)
# ============================================

name: FPL Player Scout Sync

on:
  # 💡 1. MANUAL TRIGGER — Dashboard မှ လိုအပ်သည့်အချိန်တိုင်း အချိန်မရွေး နှိပ်၍ Run နိုင်သည်
  workflow_dispatch:

  # 💡 2. AUTOMATED TIMELINE (CRON)
  schedule:
    # 🎯 နေ့စဉ် ဈေးနှုန်းပြောင်းလဲမှု Sync (Daily Price Rise/Fall Update)
    # မြန်မာစံတော်ချိန် နေ့စဉ် မနက် 07:30 (UTC 01:00) တွင် ၁ ကြိမ် မောင်းမည်
    - cron: '0 1 * * *'

    # 🎯 စနေနေ့ (Saturday Match Day) မြန်မာစံတော်ချိန် ညနေ 19:00, 20:00, 21:00, 22:00, 23:00, 24:00
    # (UTC: 12:30, 13:30, 14:30, 15:30, 16:30, 17:30)
    - cron: '30 12,13,14,15,16,17 * * 6'

    # 🎯 တနင်္ဂနွေနေ့ (Sunday Match Day) မြန်မာစံတော်ချိန် ညနေ 19:00, 20:00, 21:00, 22:00, 23:00, 24:00
    # (UTC: 12:30, 13:30, 14:30, 15:30, 16:30, 17:30)
    - cron: '30 12,13,14,15,16,17 * * 0'

concurrency:
  group: scout-sync-group
  cancel-in-progress: true

jobs:
  scout-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      # Step 1 — Repository ကုဒ်အား ရယူခြင်း
      - name: Checkout Repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      # Step 2 — Node.js Setup (cache: 'npm' ကို ဖယ်ထုတ်၍ lockfile error မဖြစ်စေရန် ပြင်ဆင်ထားသည်)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
        timeout-minutes: 2

      # Step 3 — Dependencies တင်သွင်းခြင်း (package-lock.json မရှိလျှင်လည်း အဆင်ပြေစေမည့် Safe Fallback)
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          elif [ -f package.json ]; then
            npm install --omit=dev
          else
            npm install firebase-admin axios
          fi
        timeout-minutes: 3

      # Step 4 — Player Scout Sync Engine Run ခြင်း
      - name: Run Player Scout Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/player-scout-sync.js
        timeout-minutes: 4

      # Step 5 — အောင်မြင်စွာ ပြီးဆုံးကြောင်း ထုတ်ပြန်ခြင်း
      - name: Scout Sync Complete
        run: echo "✅ TW Fantasy Player Scout Sync Completed Successfully at $(date)"
