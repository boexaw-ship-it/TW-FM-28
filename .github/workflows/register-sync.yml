name: FPL Register Sync Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fpl-register-trigger]

jobs:
  run-register-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Latest Repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install firebase-admin axios axios-cookiejar-support tough-cookie

      - name: Run Register Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "⚡ Starting TW Fantasy Register & Profile Sync Engine..."
          node scripts/register-sync.js

