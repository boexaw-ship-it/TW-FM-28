<!-- 📱 Main Application Shell -->
  <div class="app-root-shell bg-[#14172b] bg-cover bg-top bg-no-repeat">

    <!-- Ambient Glow Spheres -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
      <div style="position:absolute; top:-30px; right:-30px; width:220px; height:220px; border-radius:9999px; background:#e3dcff; filter: blur(20px); opacity:0.8;"></div>
      <div style="position:absolute; top:15%; left:-40px; width:160px; height:160px; border-radius:9999px; background:#efeaff; filter: blur(25px); opacity:0.7;"></div>
    </div>

    <!-- MAIN SCROLLABLE CONTENT BODY -->
    <main class="register-scroll-area w-full flex flex-col justify-start relative z-10 px-4">

      <!-- Compact Logo Header -->
      <div class="w-full max-w-sm mx-auto pt-3 pb-2 shrink-0 flex flex-col items-center text-center safe-top">
        <div class="w-12 h-12 rounded-2xl p-0.5 bg-gradient-to-tr from-[#8c6dff] to-[#2d3366] shadow-md mb-1.5">
          <div class="w-full h-full rounded-[14px] overflow-hidden bg-white flex items-center justify-center">
            <img src="./public/icons/icon-192x192.png"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='flex';"
                 class="w-full h-full object-cover" alt="TW Logo" />
            <div id="logo-text" class="hidden w-full h-full items-center justify-center bg-gradient-to-br from-[#2d3366] to-[#14172b] font-['Bebas_Neue'] text-xl text-[#8c6dff]">TW</div>
          </div>
        </div>
        <h1 class="font-['Bebas_Neue'] text-2xl tracking-wider text-[#14172b] m-0 leading-none">TW FANTASY LEAGUE</h1>
        <p class="text-[10px] font-bold uppercase tracking-widest text-[#2d3366] bg-[#e3dcff] px-3 py-0.5 rounded-full mt-1.5 shadow-2xs">Account Register</p>
      </div>

      <!-- 🌟 REGISTER FORM CARD -->
      <div class="slide-up w-full max-w-sm mx-auto bg-white/95 backdrop-blur-md rounded-3xl shadow-[0_12px_40px_rgba(0,0,0,0.3)] border border-white/90 flex flex-col shrink-0 mt-1 mb-4">

        <div class="px-6 pt-5 pb-3">
          <!-- Card Header Title -->
          <div class="mb-3.5">
            <h2 class="text-xl font-black text-slate-800 tracking-tight leading-snug">အကောင့်ဖွင့်ရန်</h2>
            <p class="text-xs text-slate-500 font-medium mt-0.5">TW Fantasy League တွင် ပါဝင်ရန် ဖြည့်စွက်ပေးပါ</p>
          </div>

          <!-- Input Fields -->
          <div class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 pl-1">Team Name</label>
              <input id="teamName" type="text" placeholder="မင်းရဲ့ Team နာမည်" autocomplete="off" class="w-full rounded-xl px-4 py-2.5 text-[14px] font-medium text-slate-800 bg-slate-50 border border-slate-200 focus:bg-white focus:border-[#2d3366] outline-none transition-all placeholder:text-slate-400" />
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 pl-1">FPL Team ID</label>
              <input id="fplId" type="number" inputmode="numeric" placeholder="FPL Team ID နံပါတ်" class="w-full rounded-xl px-4 py-2.5 text-[14px] font-medium text-slate-800 bg-slate-50 border border-slate-200 focus:bg-white focus:border-[#2d3366] outline-none transition-all placeholder:text-slate-400" />
              <p class="text-[10px] mt-1 text-slate-400 pl-1 leading-normal">
                💡 <a href="https://fantasy.premierleague.com" target="_blank" class="text-[#2d3366] font-bold underline">fantasy.premierleague.com</a> တွင် ကြည့်ပါ။ FPL Password မလိုပါ။
              </p>
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 pl-1">Email</label>
              <input id="email" type="email" placeholder="your@email.com" autocomplete="off" class="w-full rounded-xl px-4 py-2.5 text-[14px] font-medium text-slate-800 bg-slate-50 border border-slate-200 focus:bg-white focus:border-[#2d3366] outline-none transition-all placeholder:text-slate-400" />
            </div>

            <!-- 👁️ Password Input with Eye Toggle Button -->
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1 pl-1">Password</label>
              <div class="relative w-full">
                <input 
                  id="password" 
                  type="password" 
                  placeholder="အနည်းဆုံး ၆ လုံး" 
                  autocomplete="new-password" 
                  class="w-full rounded-xl pl-4 pr-11 py-2.5 text-[14px] font-medium text-slate-800 bg-slate-50 border border-slate-200 focus:bg-white focus:border-[#2d3366] outline-none transition-all placeholder:text-slate-400" 
                />
                <button 
                  type="button" 
                  onclick="togglePassword()" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-700 active:scale-90 transition-transform focus:outline-none flex items-center justify-center cursor-pointer z-10"
                >
                  <!-- 👁️ ဖွင့်ထားသော မျက်လုံး Icon -->
                  <svg id="eye-open-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <!-- 🙈 ပိတ်ထားသော မျက်လုံး Icon (Hidden) -->
                  <svg id="eye-close-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div id="error-msg" class="hidden text-xs font-semibold rounded-xl px-4 py-2 mt-2.5 bg-red-50 border border-red-200 text-red-600"></div>

          <!-- Register Action Button -->
          <button id="register-btn" onclick="handleRegister()" class="w-full rounded-xl py-3 bg-[#2d3366] hover:bg-[#2d3366] text-white font-black text-sm tracking-wider active:scale-[0.99] transition-all disabled:opacity-70 disabled:cursor-not-allowed shadow-md shadow-green-900/20 mt-4 mb-1 cursor-pointer">
            REGISTER
          </button>
        </div>

        <!-- Login Redirect Link -->
        <div class="px-6 py-3.5 text-center bg-slate-50/90 border-t border-slate-100 rounded-b-3xl">
          <p class="text-[12.5px] text-slate-600 font-medium">
            Account ရှိပြီးသားလား?
            <a href="#/login" class="font-bold text-[#2d3366] hover:underline ml-1">Login ဝင်ရန်</a>
          </p>
        </div>

      </div>

      <!-- Safe Bottom Margin -->
      <div class="w-full h-6 shrink-0 safe-bottom"></div>

    </main>

  </div>
