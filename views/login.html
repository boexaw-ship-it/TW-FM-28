<div class="login-root">
<div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div style="position:absolute; top:-40px; right:-40px; width:260px; height:260px; border-radius:9999px; background:#e3dcff; filter: blur(10px);"></div>
    <div style="position:absolute; top:20%; left:-50px; width:180px; height:180px; border-radius:9999px; background:#efeaff; filter: blur(20px);"></div>
  </div>

  <div class="w-full max-w-sm mx-auto px-6 pt-10 pb-6 flex-shrink-0 flex flex-col items-center text-center relative z-10">
    <div class="w-16 h-16 rounded-2xl p-0.5 bg-gradient-to-tr from-[#8c6dff] to-[#2d3366] shadow-md mb-3">
      <div class="w-full h-full rounded-[14px] overflow-hidden bg-white flex items-center justify-center">
        <img src="./public/icons/icon-192x192.png"
             onerror="this.style.display='none'; document.getElementById('logo-text').style.display='flex';"
             class="w-full h-full object-cover" alt="TW FPL Logo" />
        <div id="logo-text" class="hidden w-full h-full items-center justify-center bg-gradient-to-br from-[#2d3366] to-[#14172b] font-['Bebas_Neue'] text-xl text-[#8c6dff]">TW</div>
      </div>
    </div>
    <h1 class="font-['Bebas_Neue'] text-3xl tracking-wider text-[#14172b] m-0 leading-none">TW FANTASY LEAGUE</h1>
    <p class="text-[11px] font-bold uppercase tracking-widest text-[#2d3366] bg-[#e3dcff] px-3 py-1 rounded-full mt-2">The Ultimate Football Experience</p>
  </div>

  <div class="slide-up w-full max-w-md mx-auto bg-white/85 backdrop-blur-md rounded-t-[2.5rem] shadow-[0_-15px_40px_rgba(20,23,43,0.06)] border-t border-white/40 relative z-10 flex-1 flex flex-col">
    
    <div class="pt-8 px-6 mb-5">
      <h2 class="text-2xl font-bold text-slate-800">မင်္ဂလာပါ</h2>
      <p class="text-xs text-slate-400 mt-1">ဆက်လက်လုပ်ဆောင်ရန် Login ဝင်ရောက်ပေးပါ</p>
    </div>

    <div class="px-6 pb-4">
      <div class="mb-3.5">
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </span>
          <input id="email" type="email" placeholder="your@email.com" autocomplete="email" class="field-input w-full rounded-2xl pl-12 pr-4 py-3.5 text-[15px] font-medium" />
        </div>
      </div>

      <div class="mb-2.5">
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" class="field-input w-full rounded-2xl pl-12 pr-12 py-3.5 text-[15px] font-medium" />
          <button onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#2d3366] transition-colors cursor-pointer" id="toggle-icon">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-closed" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div id="error-msg" class="hidden text-xs font-medium rounded-xl px-4 py-2.5 mt-2 mb-2 bg-red-50 border border-red-100 text-red-600"></div>

      <div class="text-right mb-5">
        <a href="#" class="text-xs font-semibold text-slate-400 hover:text-[#2d3366] transition-colors">Forgot Password?</a>
      </div>

      <button id="login-btn" onclick="window.handleLogin()" class="w-full rounded-2xl py-3.5 bg-[#2d3366] text-white font-bold text-sm tracking-wider active:scale-[0.99] transition-all disabled:opacity-70 disabled:cursor-not-allowed shadow-md shadow-green-900/10 mb-6 cursor-pointer">
        LOGIN
      </button>
    </div>

    <div class="px-6 pt-2 pb-8 text-center">
      <p class="text-sm text-slate-500 font-medium">
        Account မရှိသေးဘူးလား? 
        <a href="#/register" class="font-bold text-[#2d3366] hover:underline ml-1">Register လုပ်ရန်</a>
      </p>
    </div>

  </div>

  <!-- ⚡ Service Worker Auto-Registration for Full Offline Support -->
</div>
