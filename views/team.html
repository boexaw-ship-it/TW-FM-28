<!-- ============================================
  TW FF APPLICATION — My Team View Layout
  Style: Full Team Name Header + 5-Pill Summary Strip with Dynamic Chip Glow
  Standards: UI Design Knowledge Pack (8px Grid & Sports Tactical UI)
  Path: views/team.html
============================================ -->

<div class="team-viewport-root">
  <!-- 🔝 1. REFINED TOP HEADER BAR (Full Team Name Display) -->
  <header class="team-top-header safe-top">
    <!-- Left: Back Arrow + MY TEAM Title -->
    <div class="header-left-group">
      <a href="#/dashboard" class="header-back-btn" aria-label="Back to Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h1 class="header-title-text">MY TEAM</h1>
    </div>
    
    <!-- Center/Right: Rank + Full Team Name + Refresh Button -->
    <div class="header-right-group">
      <div class="header-rank-chip">
        <span class="rank-tag">RANK</span>
        <span id="overall-rank-box" class="rank-num font-mono">——</span>
      </div>
      
      <!-- Team Name: GW badge မရှိတော့သဖြင့် နေရာအပြည့်ရရှိပြီး နာမည်အပြည့်မြင်ရမည် -->
      <div class="header-team-wrap">
        <span class="boat-ico" aria-hidden="true">⛵</span>
        <span id="team-name" class="team-name-text">SEAROKER Tw</span>
      </div>
      
      <button id="btn-refresh-team" onclick="window.forceRefreshTeam()" class="header-refresh-btn" type="button" aria-label="Refresh Squad">
        <span id="refresh-team-icon" class="refresh-ico">🔄</span>
      </button>
    </div>
  </header>
  
  <!-- 📊 2. MATCHDAY SUMMARY 5-PILL STRIP (GW · Hit · GWP · TTP · CHIP) -->
  <section class="matchday-summary-container" aria-label="Gameweek Overview">
    <div class="matchday-summary-capsule">
      <!-- 1. Gameweek Pill (Header မှ အောက်သို့ ရွှေ့ထားသည်) -->
      <div class="summary-pill pill-gw">
        <b id="gw-label" class="pill-value font-mono">GW 5</b>
      </div>
      
      <!-- 2. Transfer Hit Cost Pill -->
      <div class="summary-pill pill-hit">
        <span id="hit-label" class="font-mono">Hit: -0</span>
      </div>
      
      <!-- 3. Gameweek Points Pill -->
      <div class="summary-pill pill-gwp">
        <span class="pill-title">GWP:</span>
        <b id="gw-pts" class="pill-value font-mono">51</b>
      </div>
      
      <!-- 4. Total Points Pill (OVRP မှ TTP သို့ ပြောင်းလဲထားသည်) -->
      <div class="summary-pill pill-ttp">
        <span class="pill-title">TTP:</span>
        <b id="overall-pts" class="pill-value font-mono">330</b>
      </div>
      
      <!-- 5. Dynamic Active Chip Pill (Triple Captain, Bench Boost, etc.) -->
      <div class="summary-pill pill-chip" id="chip-pill-container">
        <span id="chip-badge" class="chip-text">NO CHIP</span>
      </div>
    </div>
  </section>
  
  <!-- ⚡ 3. TRANSFER STRATEGY BUTTON -->
  <div class="strategy-btn-wrapper">
    <button id="btn-transfer-action" onclick="window.go('transfers')" type="button" class="btn-transfer-strategy">
      <span class="strategy-ico">🔄</span>
      <span class="strategy-txt">TRANSFER STRATEGY</span>
    </button>
  </div>
  
  <!-- ⚽ 4. MAIN SCROLL ARENA (Tactical Pitch & Subtle Bench Booth) -->
  <main class="pitch-scroll-area">
    <!-- Football Pitch: Dashboard စတိုင် အောက်ခံရောင်စစ်စစ် (Matt Deep Blue/Black) -->
    <section class="tactical-pitch-card" aria-label="Starting XI Lineup">
      <div class="pitch-floodlight-flare" aria-hidden="true"></div>
      
      <!-- Top-Left Avg Pts Badge -->
      <div class="pitch-meta-badge badge-left">
        <span class="meta-label">Avg Pts</span>
        <b id="avg-pts" class="meta-val font-mono">48</b>
      </div>
      
      <!-- Top-Right Brand Badge -->
      <div class="pitch-meta-badge badge-right">
        <span class="meta-brand font-mono">TW FM</span>
      </div>
      
      <!-- Pitch Vector Lines (SVG) -->
      <svg class="pitch-lines-svg" viewBox="0 0 200 420" preserveAspectRatio="none" aria-hidden="true">
        <rect x="6" y="6" width="188" height="408" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <line x1="6" y1="210" x2="194" y2="210" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <circle cx="100" cy="210" r="32" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <circle cx="100" cy="210" r="2" fill="rgba(140, 109, 255, 0.5)" />
        <rect x="40" y="6" width="120" height="48" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <rect x="40" y="366" width="120" height="48" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <rect x="68" y="6" width="64" height="18" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
        <rect x="68" y="396" width="64" height="18" fill="none" stroke="rgba(140, 109, 255, 0.25)" stroke-width="1.2" />
      </svg>
      
      <!-- Dynamic Starting XI Formation Rows (GK, DEF, MID, FWD) -->
      <div class="pitch-formation-content">
        <div id="pitch-rows" class="pitch-container">
          <p class="pitch-loading-text">Team loading...</p>
        </div>
      </div>
    </section>
    
    <!-- 🪑 5. BENCH BOOTH (မသိမသာ အောက်ခံရောင်ခွဲထားသော Frosted Dugout) -->
    <section class="bench-booth-card" id="bench-booth-container" aria-label="Substitutes Bench Booth">
      <div class="bench-header">
        <span class="bench-badge-chip" id="bench-booth-label">BENCH BOOTH</span>
      </div>
      <div id="bench-row" class="bench-grid-row"></div>
    </section>
  </main>
</div>
