<!-- 📱 9:16 Frame Container (Mobile တွင် 100% ပြည့်ပြီး PC တွင် 9:16 ဖြစ်သည်) -->
  <div class="app-viewport-9-16">

    <!-- 🏆 TOP HEADER BAR (Re-aligned: Arrow + MY TEAM + GW + RANK + Team Name (Flex) + Refresh) -->
    <header class="bg-[#14172b] border-b border-[#2d3366] px-3 py-2 flex items-center gap-2 shrink-0 z-30 shadow-md safe-top w-full">
      
      <!-- ဘယ်ဘက်အစု: Back Arrow + MY TEAM -->
      <div class="flex items-center gap-1 shrink-0">
        <a href="#/dashboard" class="text-[#8c6dff] text-base font-bold pl-0.5">←</a>
        <h1 class="gold-text font-bold text-lg tracking-wider font-['Bebas_Neue'] leading-none">MY TEAM</h1>
      </div>

      <!-- GW Badge -->
      <span id="gw-label" class="text-[8.5px] font-black px-1.5 py-0.5 rounded-md bg-black/60 border border-[#b3a1ff]/40 text-[#b3a1ff] font-mono shrink-0">GW —</span>

      <!-- Rank Box (GW ဘေးသို့ ရွှေ့ထားသည်) -->
      <div class="rounded-md px-1.5 py-0.5 bg-black/70 border border-white/20 flex items-center gap-1 shrink-0">
        <span class="text-[7.5px] font-bold uppercase tracking-tight text-[#A0C49D]">RANK</span>
        <span id="overall-rank-box" class="text-[10px] font-black text-white font-mono leading-none">——</span>
      </div>

      <!-- Team Name (အလယ်တွင် နေရာအပြည့်ယူပြီး နာမည်ရှည်ပေါ်စေသည်) -->
      <div class="flex-1 min-w-0 text-right pr-0.5">
        <span id="team-name" class="text-[11.5px] font-black tracking-tight text-[#d9d0ff] truncate block leading-tight">——</span>
      </div>

      <!-- 🔄 Refresh Button (Countdown မပါဘဲ liveteamquota စနစ်သစ်နှင့် ချိတ်ဆက်ထားသည်) -->
      <button id="btn-refresh-team" onclick="window.forceRefreshTeam()" class="flex items-center justify-center bg-[#2d3366] border border-[#3a3f7a] text-[#8c6dff] w-7 h-7 rounded-lg text-[10px] font-black active:scale-95 transition-all shadow-md cursor-pointer shrink-0">
        <span id="refresh-team-icon">🔄</span>
      </button>

    </header>

    <!-- ⚪ DASHBOARD STRIP (Hit · GW Pts · OV Pts · Chip) -->
    <div class="px-3 pt-2 pb-1 shrink-0 z-20 bg-[#14172b]">
      <div class="bg-white rounded-xl px-2 py-1.5 shadow-md border border-slate-200 flex items-center justify-between gap-1 text-slate-900">
        <div class="bg-red-100/80 border border-red-200 rounded-lg px-2 py-0.5 flex items-center justify-center shrink-0">
          <span id="hit-label" class="text-[10px] font-black text-red-700 font-mono">Hit: -0</span>
        </div>

        <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-2 py-0.5 flex items-center justify-center gap-1 flex-1">
          <span class="text-[9px] font-black text-emerald-950">GWP:</span>
          <span id="gw-pts" class="text-xs font-black text-emerald-800 font-mono">—</span>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg px-2 py-0.5 flex items-center justify-center gap-1 flex-1">
          <span class="text-[9px] font-black text-blue-950">OVRP:</span>
          <span id="overall-pts" class="text-xs font-black text-blue-800 font-mono">—</span>
        </div>

        <div class="bg-amber-100/70 border border-amber-300 rounded-lg px-2 py-0.5 flex items-center justify-center shrink-0">
          <span id="chip-badge" class="text-[8.5px] font-black text-amber-900 uppercase tracking-tight">NO CHIP</span>
        </div>
      </div>
    </div>

    <!-- 💡 🔄 TRANSFER STRATEGY BUTTON -->
    <div class="px-3 pt-0.5 pb-1.5 shrink-0 z-20 bg-[#14172b]">
      <button id="btn-transfer-action" onclick="window.go('transfers')" 
              class="w-full py-2 rounded-xl font-black text-xs tracking-wider uppercase flex items-center justify-center gap-1.5 shadow-md active:scale-98 transition"
              style="background: linear-gradient(135deg, #8c6dff, #b3a1ff); color: #14172b;">
        <span class="text-xs">🔄</span> TRANSFER STRATEGY
      </button>
    </div>

    <!-- ⚽ MAIN SCROLL AREA (Pitch View & Bench) -->
    <main class="pitch-scroll-area px-3 py-1 space-y-2.5 bg-[#14172b] relative z-10">

      <!-- Football Pitch Field View Component -->
      <div class="relative bg-gradient-to-b from-[#2a2f6b] via-[#1d2250] to-[#141838] rounded-2xl p-4 border border-white/10 shadow-xl overflow-visible">
        
        <!-- 💡 AVERAGE POINTS BADGE -->
        <div class="absolute top-3 left-3 z-20 bg-black/60 backdrop-blur-xs border border-white/20 rounded-xl px-2 py-0.5 flex flex-col items-center shadow-lg pointer-events-none select-none">
          <span class="text-[7px] font-bold uppercase tracking-widest text-[#d9d0ff]/80">Avg Pts</span>
          <span id="avg-pts" class="text-xs font-black text-[#b3a1ff] font-mono leading-tight">—</span>
        </div>

        <!-- 💡 TW FM NAME PLATE -->
        <div class="absolute top-3 right-3 z-20 bg-black/60 backdrop-blur-xs border border-[#b3a1ff]/40 rounded-xl px-2.5 py-1 flex items-center justify-center shadow-lg pointer-events-none select-none">
          <span class="text-[9px] font-black tracking-wider text-[#b3a1ff] font-mono leading-none">TW FM</span>
        </div>

        <!-- Pitch Lines SVG -->
        <svg class="absolute inset-0 w-full h-full opacity-35 pointer-events-none" viewBox="0 0 200 420" preserveAspectRatio="none">
          <rect x="6" y="6" width="188" height="408" fill="none" stroke="#a58bff" stroke-width="1.3"/>
          <line x1="6" y1="210" x2="194" y2="210" stroke="#a58bff" stroke-width="1.3"/>
          <circle cx="100" cy="210" r="32" fill="none" stroke="#a58bff" stroke-width="1.3"/>
          <circle cx="100" cy="210" r="1.5" fill="#a58bff"/>
          <rect x="40" y="6" width="120" height="45" fill="none" stroke="#a58bff" stroke-width="1.3"/>
          <rect x="40" y="369" width="120" height="45" fill="none" stroke="#a58bff" stroke-width="1.3"/>
          <rect x="68" y="6" width="64" height="18" fill="none" stroke="#a58bff" stroke-width="1.3"/>
          <rect x="68" y="396" width="64" height="18" fill="none" stroke="#a58bff" stroke-width="1.3"/>
        </svg>

        <div class="relative z-10 h-full overflow-visible">
          <div id="pitch-rows" class="h-full overflow-visible">
            <p class="text-center text-xs py-24 text-white/50 font-medium tracking-wide">Team loading...</p>
          </div>
        </div>
      </div>

      <!-- Bench Section Layer Component Box -->
      <div class="rounded-2xl p-3 bg-gradient-to-b from-[#2a2f6b] via-[#1d2250] to-[#141838] border border-white/10 shadow-xl mb-3">
        <p class="text-[9px] font-black text-[#8c6dff] tracking-widest uppercase text-center mb-2">BENCH</p>
        <div id="bench-row" class="flex justify-around items-center w-full"></div>
      </div>

    </main>
</div>
