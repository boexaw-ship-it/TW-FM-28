<!-- 📱 9:16 Frame Container (Mobile = 100% Full, PC = 9:16 Frame) -->
  <div class="app-root-shell">

    <!-- TOP APP BAR (Refresh Button ထည့်သွင်းထားသည်) -->
    <header style="background:#14172b; border-bottom:1px solid #2d3366;" class="px-4 py-3 flex items-center justify-between shrink-0 z-30 shadow-md safe-top">
      <div class="flex items-center gap-2">
        <a href="#/more" style="color:#8c6dff; font-size:1.2rem; font-weight:bold;">←</a>
        <h1 class="gold-text font-bold leading-none" style="font-family:'Bebas Neue'; letter-spacing:0.1em; font-size:1.3rem;">MATCH CENTER</h1>
      </div>
      
      <!-- Right Action Container: Gameweek Selector & Refresh Button -->
      <div class="flex items-center gap-2">
        <div id="gw-selector-container"></div>
        <button id="btn-refresh-fixtures" onclick="window.forceRefreshFixtures()" class="flex items-center gap-1 bg-[#2d3366] border border-[#3a3f7a] text-[#8c6dff] px-2.5 py-1.5 rounded-lg text-[10px] font-black active:scale-95 transition-all shadow-md cursor-pointer shrink-0">
          <span id="refresh-fixtures-icon">🔄</span> Refresh
        </button>
      </div>
    </header>

    <!-- TAB FILTER BAR -->
    <div style="background:#14172b; border-bottom:1px solid #2d3366;" class="flex shrink-0 z-20">
      <button id="tab-all" class="tab-btn flex-1 py-2 text-xs font-black transition" onclick="window.filterFixtures('all')" style="border-color:#8c6dff; color:#8c6dff;">All Matches</button>
      <button id="tab-upcoming" class="tab-btn flex-1 py-2 text-xs font-black transition" onclick="window.filterFixtures('upcoming')" style="color:#8c6dff;">Upcoming</button>
      <button id="tab-finished" class="tab-btn flex-1 py-2 text-xs font-black transition" onclick="window.filterFixtures('finished')" style="color:#8c6dff;">Results</button>
    </div>

    <!-- MAIN SCROLL AREA (Matches Container) -->
    <main id="fixtures-scroll-container" class="fixtures-scroll-area px-4 py-4 relative z-10">
      <div id="fixtures-list" class="w-full flex flex-col gap-1">
        
        <div class="flex flex-col items-center justify-center py-24 gap-2 bg-white rounded-2xl border border-slate-100 shadow-sm">
          <span class="text-xl animate-spin">⚽</span>
          <span class="text-xs font-bold" style="color:#14172b !important;">Loading Matches...</span>
        </div>

      </div>
    </main>
</div>
