<!-- ============================================
  TW FM — Dashboard View Layout
  Standards: UI Design Knowledge Pack (Zero Mock, 100% Dynamic Firestore)
  Path: views/dashboard.html
============================================ -->

<div class="home-root">
  <!-- 🌌 STADIUM AMBIENT MESH BACKGROUND -->
  <div class="stadium-ambient-mesh" aria-hidden="true">
    <div class="mesh-orb orb-purple"></div>
    <div class="mesh-orb orb-blue"></div>
    <div class="mesh-pitch-circle"></div>
  </div>

  <!-- 🔝 1. CLEAN TOP HEADER -->
  <header class="home-head safe-top">
    <div class="home-brand">
      <div class="home-brand-text">
        <h1 class="brand-title">TW FM</h1>
        <p class="brand-subtitle">TOGETHER WE PLAY</p>
      </div>
    </div>

    <div class="home-who">
      <!-- 💡 Dynamic Account Type Pill: "TW MEMBER" အသေရေးသားထားခြင်းကို လုံးဝ ဖယ်ရှားပြီးဖြစ်သည် -->
      <div id="account-type-pill" class="home-pill" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="currentColor" class="user-pill-ico" aria-hidden="true">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span id="account-type-text">Loading...</span>
      </div>
      <button id="pending-refresh-btn" onclick="handleCheckApprovalStatus()" class="hidden home-refresh" type="button" aria-label="Refresh Status">
        <span id="check-icon">⟳</span><span>REFRESH</span>
      </button>
    </div>
  </header>
  
  <!-- 📜 Main Fixed Single Viewport Container (Zero Scroll) -->
  <main class="home-scroll">
    <!-- 🌟 2. UNIFIED HERO HUB (Matt Black Border Line & Dynamic Firestore Manager Info) -->
    <section class="luxury-hero-hub" id="hero-deadline-card" aria-label="Manager and Gameweek Status">
      <!-- Top Row: Dynamic Team Info & Deadline Chip -->
      <div class="hero-hub-top">
        <div class="hero-manager-meta">
          <div class="hero-team-title">
            <span class="boat-ico" aria-hidden="true">⛵</span>
            <span id="welcome-name" class="team-text">Loading...</span>
          </div>
          <p class="hero-manager-sub">
            <span class="opacity-60">Manager:</span> <span id="welcome-manager" class="manager-name">...</span>
          </p>
        </div>
        
        <!-- Deadline Header Group -->
        <div class="hero-deadline-group">
          <div class="hero-gw-chip">
            <span class="trophy-gold-ico" aria-hidden="true">🏆</span>
            <span id="gw-label" class="gw-text">DEADLINE</span>
          </div>
          <div class="hero-date-text" id="gw-when">
            Calculating...
          </div>
        </div>
      </div>

      <!-- Bottom Row: Real Countdown 4-Boxes -->
      <div class="hero-hub-bottom">
        <div class="home-cd" id="home-cd" aria-live="polite">
          <div class="cd-box">
            <b id="cd-d">--</b>
            <small>DAYS</small>
          </div>
          <div class="cd-box">
            <b id="cd-h">--</b>
            <small>HRS</small>
          </div>
          <div class="cd-box">
            <b id="cd-m">--</b>
            <small>MIN</small>
          </div>
          <div class="cd-box cd-sec">
            <b id="cd-s">--</b>
            <small>SEC</small>
          </div>
        </div>
      </div>
    </section>
    
    <!-- 📊 3. 3-COLUMN PERFORMANCE STATS (Real Live Points Tiles) -->
    <section class="luxury-stats-card" aria-label="Season Performance Overview">
      <!-- Tile 1: Total Points -->
      <div class="stat-nameplate-tile neon-glow-green">
        <div class="col-head">
          <span class="stat-ico c-green" aria-hidden="true">★</span>
          <span class="stat-title">TOTAL POINTS</span>
        </div>
        <b id="st-total" class="stat-num">--</b>
        <em id="st-total-d" class="stat-change up">--</em>
      </div>

      <!-- Tile 2: Overall Rank -->
      <div class="stat-nameplate-tile neon-glow-gold">
        <div class="col-head">
          <span class="stat-ico c-gold" aria-hidden="true">🏆</span>
          <span class="stat-title">OVERALL RANK</span>
        </div>
        <b id="st-rank" class="stat-num font-mono">--</b>
        <em id="st-rank-d" class="stat-change up">--</em>
      </div>

      <!-- Tile 3: GW Score -->
      <div class="stat-nameplate-tile neon-glow-cyan">
        <div class="col-head">
          <span class="stat-ico c-cyan" aria-hidden="true">📊</span>
          <span class="stat-title" id="st-gw-l">GW SCORE</span>
        </div>
        <b id="st-gw" class="stat-num">--</b>
        <em id="st-gw-d" class="stat-change up">--</em>
      </div>
    </section>
    
    <!-- 🌟 4. TOP 5 PLAYERS CARD GRID (Pure Dynamic Scout Feed) -->
    <section class="home-top-grid-section" aria-label="Top 5 Players">
      <div class="home-section-header">
        <h3 class="home-h">
          <span class="h-dot" aria-hidden="true">●</span>
          Top 5 Players
        </h3>
        <a href="#/scout" class="home-see-all">View All ›</a>
      </div>
      
      <div class="home-player-cards-grid" id="leader-cards-container" aria-live="polite">
        <div class="player-card-skel"></div>
        <div class="player-card-skel"></div>
        <div class="player-card-skel"></div>
        <div class="player-card-skel"></div>
        <div class="player-card-skel"></div>
      </div>
    </section>
    
    <!-- ⚡ 5. QUICK STATS TABS (Dynamic Frameless Clean Filter Strip) -->
    <section class="home-quick-stats-section" aria-label="Quick Stats Filters">
      <div class="home-section-header">
        <h3 class="home-h">
          <span class="h-dot" aria-hidden="true">●</span>
          Quick Stats
        </h3>
      </div>
      
      <div class="home-tabs frameless-tabs" id="leader-tabs" role="tablist">
        <button class="on" data-k="cap" style="--tab-c:#FFFFFF" role="tab" aria-selected="true" type="button">
          <span class="tab-ico">👑</span>
          <span class="tab-txt">Most Captain</span>
        </button>
        <button data-k="own" style="--tab-c:#FBBF24" role="tab" aria-selected="false" type="button">
          <span class="tab-ico">🛡️</span>
          <span class="tab-txt">Ownership</span>
        </button>
        <button data-k="tin" style="--tab-c:#22C55E" role="tab" aria-selected="false" type="button">
          <span class="tab-ico">⇄</span>
          <span class="tab-txt">Transfer In</span>
        </button>
        <button data-k="tout" style="--tab-c:#EF4444" role="tab" aria-selected="false" type="button">
          <span class="tab-ico">⇄</span>
          <span class="tab-txt">Transfer Out</span>
        </button>
        <button data-k="total" style="--tab-c:#38BDF8" role="tab" aria-selected="false" type="button">
          <span class="tab-ico">★</span>
          <span class="tab-txt">Total Point</span>
        </button>
        <button data-k="gw" style="--tab-c:#34D399" role="tab" aria-selected="false" type="button">
          <span class="tab-ico">⚡</span>
          <span class="tab-txt">Week Point</span>
        </button>
      </div>
    </section>
    
    <!-- 🗓️ 6. POLISHED NEXT FIXTURE CARD (Pure Dynamic Matchday Feed) -->
    <a class="home-next-fixture-card text-decoration-none" id="next-fixture-card-link" href="#/fixtures" aria-label="Open Full Fixtures">
      <div class="fixture-head">
        <span class="fixture-tag">📅 Next Fixture</span>
        <span class="fixture-time" id="next-fixture-time">Loading fixture...</span>
      </div>
      
      <div class="fixture-body">
        <div class="fixture-team home-side">
          <img src="./assets/badges/che.png" alt="HOME" class="fixture-badge" id="fixture-home-badge">
          <div class="team-meta">
            <b id="fixture-home-code">---</b>
            <small id="fixture-home-name">Loading...</small>
          </div>
        </div>
        
        <div class="fixture-vs-pill">VS</div>
        
        <div class="fixture-team away-side">
          <div class="team-meta text-right">
            <b id="fixture-away-code">---</b>
            <small id="fixture-away-name">Loading...</small>
          </div>
          <img src="./assets/badges/che.png" alt="AWAY" class="fixture-badge" id="fixture-away-badge">
        </div>
        
        <span class="fixture-arrow" aria-hidden="true">›</span>
      </div>
    </a>
  </main>
</div>
